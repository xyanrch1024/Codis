# Codis C++ 多 Provider 配置
# 路径: ~/.config/codis/config.toml 或通过 -c 指定
#
# API Key 通过环境变量设置，不要在配置文件里写明文:
#   export OPENAI_API_KEY="sk-..."
#   export DEEPSEEK_API_KEY="sk-..."
#   export GLM_API_KEY="..."

default_provider = "glm"

[llm]
max_tokens = 4096

[[providers]]
name = "openai"
api_key_env = "OPENAI_API_KEY"
model = "gpt-4o"
base_url = "https://api.openai.com/v1"
max_context = 128000

[[providers]]
name = "deepseek"
api_key_env = "DEEPSEEK_API_KEY"
model = "deepseek-v4-flash"
base_url = "https://api.deepseek.com"
max_context = 128000

[[providers]]
name = "glm"
api_key_env = "GLM_API_KEY"
    model = "glm-4.7-flash"
    base_url = "https://open.bigmodel.cn/api/paas/v4"
    max_context = 128000

[feishu]
app_id = ""
app_secret = ""
enabled = false

# 工具权限策略（可选，默认按工具内置声明）
#   allow = 免确认直接执行
#   ask   = 执行前在客户端弹确认（TUI 按 y/n；-y 自动批准）
#   deny  = 永远拒绝
# confirm_timeout = Ask 工具等待确认的秒数，超时视为拒绝
[permissions]
allow = ["read", "glob", "grep", "bash", "websearch"]
ask = ["write", "edit"]
# deny = []
confirm_timeout = 120

# WebSearch 工具
#   backend: bing(免 key, 默认) | serpapi | brave | tavily(后三者需要 api_key)
#   api_key_env: 从环境变量读 key（推荐，不写明文）
[websearch]
backend = "tavily"
api_key_env = "TAVILY_API_KEY"
max_results = 5
timeout_seconds = 15

# 技能（skill）：<dir>/<skill_id>/SKILL.md，模型经 skill 工具按需加载指令
#   dirs: 扫描目录（相对路径相对 server 工作目录）；默认额外扫描 ~/.codis/skills
[skills]
dirs = ["skills/"]

# MCP 服务器（Model Context Protocol）
#   transport = stdio（默认）| http
#   stdio: command/args 启动子进程（如 npx @modelcontextprotocol/server-xxx）
#   http:  url = "https://host/path"，api_key_env 可选（Bearer 认证）
#   MCP 工具默认 Ask 权限，可用 [permissions] ask/allow 按名覆写
#   示例（需要 Node.js）:
# [[mcp.servers]]
# name = "filesystem"
# transport = "stdio"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "/home/user/projects"]
# 
# [[mcp.servers]]
# name = "remote"
# transport = "http"
# url = "https://mcp.example.com/mcp"
# api_key_env = "MCP_API_KEY"
[[mcp.servers]]
name = "fs"
transport = "stdio"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "/home/wsl-ubuntu-1/projects"]
timeout_seconds = 15

[[mcp.servers]]
name = "fastmcp"
transport = "http"
url = "http://127.0.0.1:8767/mcp"
timeout_seconds = 5

