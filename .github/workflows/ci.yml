name: ci

# 质量门：push / PR 触发，构建 + 跑全部单测（release 打包仍由 release.yml 负责）
on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # vcpkg manifest 模式（vcpkg.json 锁定 builtin-baseline，与 release.yml 同一 commit）
      - name: Setup vcpkg
        run: |
          git clone --quiet https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          cd "$HOME/vcpkg"
          git checkout --quiet cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3
          ./bootstrap-vcpkg.sh -disableMetrics

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.HOME }}/vcpkg
            ${{ env.HOME }}/.cache/vcpkg
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Configure
        run: |
          cmake -B build -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON \
            -DCMAKE_TOOLCHAIN_FILE="$HOME/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build -j4

      - name: Test
        run: ctest --test-dir build --output-on-failure